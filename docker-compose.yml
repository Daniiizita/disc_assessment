services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - DEBUG=1
      - DATABASE_URL=mysql://discuser:discpassword@db:3306/disc_assessment
    depends_on:
      - db
    command: >
      sh -c "python manage.py collectstatic --noinput --clear &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: disc_assessment
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: discuser
      MYSQL_PASSWORD: discpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  static_volume: